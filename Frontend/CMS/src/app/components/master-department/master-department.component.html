<app-loader *ngIf="loading"></app-loader>
<h2 class="pt-3">Department Master</h2>

<div class="px-md-5 px-3">
  <button data-bs-toggle="modal" data-bs-target="#department-add" class="add-btn btn btn-outline-primary mb-2">
    <a><i class="fa-solid fa-file-circle-plus"></i> Add department</a>
  </button>
</div>

<app-table [data]="departments" [displayedColumns]="displayedColumns" [columnsInfo]="columnsInfo">
</app-table>

<p class="no-records fs-5" *ngIf="departments.length == 0" style="text-align: center;">No records</p>

<app-pagination [maxPage]="maxPage" [records]="departments.length" [pageNumbers]="pageNumbers"
  [GetPage]="GetPage.bind(this)"></app-pagination>

<ng-template #actionRef let-row>
  <i class="fa-regular fa-pen-to-square icon" data-bs-toggle="modal" data-bs-target="#department-edit"
    (click)="GetDepartment(row.departmentId)"></i>
  <i class="fa-solid fa-trash icon" data-bs-toggle="modal" data-bs-target="#department-delete"
    (click)="deleteDepartment(row.departmentId)"></i>
</ng-template>

<div class="modal fade" id="department-add" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <!-- <div class="" id="department-add" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true"> -->
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header d-flex justify-content-between">
        <h1 class="modal-title fs-5 add-header"><i class="fa-solid fa-file-circle-plus"></i> Add New Department</h1>
        <button type="button" class="btn close-btn" data-bs-dismiss="modal" aria-label="Close" (click)="resetFrom()"><i
            class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <form #departmentForm="ngForm" (ngSubmit)="addDepartment(departmentForm)">
          <div class="form-group">
            <label for="departmentName">Department Name</label>
            <span class="error">*</span>
            <span class="error" *ngIf="name.invalid && (name.touched || name.dirty)">
              <span *ngIf="name.errors?.['required']">Department name is required.</span>
              <span *ngIf="name.errors?.['pattern']">Only letters and spaces are allowed.</span>
            </span>
            <input type="text" #name="ngModel" class="form-control" id="departmentName" name="departmentName"
              [(ngModel)]="addDept.departmentName" required pattern="^[a-zA-Z ]+$" />

          </div>
          <br>
          <div class="modal-footer">
            <button type="submit" class=" add-btn btn btn-primary add-modal-btn">Save</button>
            &nbsp;
            <button type="reset" class="btn btn-outline-danger" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="department-edit" #departmentEditModal data-bs-backdrop="static" data-bs-keyboard="false"
  tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content">
      <div class="modal-header d-flex justify-content-between">
        <h1 style="color: whitesmoke;" class="modal-title fs-5 fw-bolder">Edit</h1>
        <button type="reset" class="btn close-btn" data-bs-dismiss="modal" aria-label="Close"
          (click)="closeEditApproverCollapses()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-landmark"></i></span>

            <input #editDepartmentName class="form-control" placeholder="Change department name" type="text"
              value="{{dept != undefined ? dept.departmentName : ''}}" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn add-btn add-modal-btn"
          (click)="editDepartment(dept != undefined ? dept.departmentId : 0)">Save</button>
        <button type="reset" class="btn btn-outline-danger" data-bs-dismiss="modal"
          (click)="closeEditApproverCollapses()">Cancel</button>
      </div>
    </form>
  </div>
</div>
