<div class="modal fade" id="contract-addendum" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
      <form class="modal-content" [formGroup]="addaddendumForm"
        (ngSubmit)="onAddAddendumFormSubmit(contractDetails !== undefined && contractDetails.contractId !== undefined ? +(contractDetails.contractId) : 0)">
        <div class="modal-header d-flex justify-content-between">
          <h1 style="color: whitesmoke;" class="modal-title fs-5 fw-bolder">Add Addendum</h1>
          <button type="button" class="btn close-btn" data-bs-dismiss="modal" aria-label="Close"><i
              class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <div class="p-2">
            <div class="fields-container">
              <div class="m-3">
                <label for="termsAndConditions">Contract Name<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('contractName')?.hasError('required') && (addaddendumForm?.get('contractName')?.dirty || addaddendumForm?.get('contractName')?.touched)"
                  style="color: red;">Required</span>
                <input class="form-control" type="text" id="companyName" placeholder="Enter contract name"
                  formControlName="contractName">
              </div>
              <div class="m-3">
                <label for="department">Department<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('departmentId')?.hasError('required') && (addaddendumForm?.get('departmentId')?.dirty || addaddendumForm?.get('departmentId')?.touched)"
                  style="color: red;">Required</span>
                <span
                  *ngIf="addaddendumForm?.get('departmentId')?.hasError('pattern') && (addaddendumForm?.get('departmentId')?.dirty || addaddendumForm?.get('departmentId')?.touched)"
                  style="color: red;">Invalid number</span>
                <select #depID class="form-select" name="departmentId" id="departmentId" formControlName="departmentId">
                  <option value="">--Select one Department--</option>
                  <option *ngFor="let department of departments" value="{{department.departmentId}}">
                    {{department.departmentName}}</option>
                </select>
              </div>
              <div class="m-3">
                <label for="termsAndConditions">Contract with Company<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('contractWithCompanyId')?.hasError('required') && (addaddendumForm?.get('contractWithCompanyId')?.dirty || addaddendumForm?.get('contractWithCompanyId')?.touched)"
                  style="color: red;">Required</span>
                <span
                  *ngIf="addaddendumForm?.get('contractWithCompanyId')?.hasError('pattern') && (addaddendumForm?.get('contractWithCompanyId')?.dirty || addaddendumForm?.get('contractWithCompanyId')?.touched)"
                  style="color: red;">Invalid number</span>
                <select class="form-select" name="contractWithCompanyId" id="contractWithCompanyId"
                  formControlName="contractWithCompanyId">
                  <option value="">--Select one Company--</option>
                  <option *ngFor="let company of companies" value="{{company.valueId}}">{{company.companyName}}
                  </option>
                </select>
              </div>
              <div class="m-3">
                <label for="termsAndConditions">Contract Type<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('contractTypeId')?.hasError('required') && (addaddendumForm?.get('contractTypeId')?.dirty || addaddendumForm?.get('contractTypeId')?.touched)"
                  style="color: red;">Required</span>
                <select class="form-select" name="contractTypeId" id="contractTypeId" formControlName="contractTypeId">
                  <option value="" disabled selected>--Select one Contract Type--</option>
                  <option *ngFor="let contractType of contractTypes" value="{{contractType.valueId}}">
                    {{contractType.contractTypeName}}</option>
                </select>
              </div>
              <div class="m-3">
                <label for="termsAndConditions">Apostille Type<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('apostilleTypeId')?.hasError('required') && (addaddendumForm?.get('apostilleTypeId')?.dirty || addaddendumForm?.get('apostilleTypeId')?.touched)"
                  style="color: red;">Required</span>
                <span
                  *ngIf="addaddendumForm?.get('apostilleTypeId')?.hasError('pattern') && (addaddendumForm?.get('apostilleTypeId')?.dirty || addaddendumForm?.get('apostilleTypeId')?.touched)"
                  style="color: red;">Invalid number</span>
                <!-- <input class="form-control" type="text" id="apostilleTypeId" placeholder="Enter Apostille ID" formControlName="apostilleTypeId"> -->
                <select class="form-select" name="apostilleTypeId" id="apostilleTypeId"
                  formControlName="apostilleTypeId">
                  <option value="">--Select one Apostille Type--</option>
                  <option *ngFor="let apostille of apostilleTypes" value="{{apostille.valueId}}">
                    {{apostille.apostilleName}}</option>
                </select>
              </div>
              <div class="m-3">
                <label for="termsAndConditions">Actual Document Reference Number<span
                    style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('actualDocRefNo')?.hasError('required') && (addaddendumForm?.get('actualDocRefNo')?.dirty || addaddendumForm?.get('actualDocRefNo')?.touched)"
                  style="color: red;">Required</span>
                <span
                  *ngIf="addaddendumForm?.get('actualDocRefNo')?.hasError('pattern') && (addaddendumForm?.get('actualDocRefNo')?.dirty || addaddendumForm?.get('actualDocRefNo')?.touched)"
                  style="color: red;">Invalid number</span>
                <input class="form-control" type="text" id="actualDocRefNo"
                  placeholder="Enter Actual Document Reference Number" formControlName="actualDocRefNo">
              </div>

              <div class="m-3">
                <label for="termsAndConditions">Retainer Contract Type<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('retainerContract')?.hasError('required') && (addaddendumForm?.get('retainerContract')?.dirty || addaddendumForm?.get('retainerContract')?.touched)"
                  style="color: red;">Required</span>
                <span
                  *ngIf="addaddendumForm?.get('retainerContract')?.hasError('pattern') && (addaddendumForm?.get('retainerContract')?.dirty || addaddendumForm?.get('retainerContract')?.touched)"
                  style="color: red;">Invalid number</span>
                <select class="form-select" name="retainerContract" id="retainerContract"
                  formControlName="retainerContract">
                  <option value="1">None</option>
                  <option value="2">Weekly</option>
                  <option value="3">Monthly</option>
                  <option value="4">Quarterly</option>
                  <option value="5">Yearly</option>
                </select>
              </div>

              <div class="m-3">
                <label for="termsAndConditions">Terms and Conditions<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('termsAndConditions')?.hasError('required') && (addaddendumForm?.get('termsAndConditions')?.dirty || addaddendumForm?.get('termsAndConditions')?.touched)"
                  style="color: red;">Required</span>
                <input class="form-control" type="text" placeholder="Terms and Conditions" id="termsAndConditions"
                  formControlName="termsAndConditions">
              </div>

              <div class="m-3">
                <label for="validFrom">Valid from<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('validFrom')?.hasError('required') && (addaddendumForm?.get('validFrom')?.dirty || addaddendumForm?.get('validFrom')?.touched)"
                  style="color: red;">Required</span>
                <input class="form-control" type="date" id="validFrom" formControlName="validFrom">
              </div>

              <div class="m-3">
                <label for="validTill">Valid till<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('validTill')?.hasError('required') && (addaddendumForm?.get('validTill')?.dirty || addaddendumForm?.get('validTill')?.touched)"
                  style="color: red;">Required</span>
                <input class="form-control" type="date" id="validTill" formControlName="validTill">
              </div>

              <div class="m-3">
                <label for="termsAndConditions">Employee Custodian Name<span style="color: red;">*</span></label>
                <span
                  *ngIf="addaddendumForm?.get('empCustodianId')?.hasError('required') && (addaddendumForm?.get('empCustodianId')?.dirty || addaddendumForm?.get('empCustodianId')?.touched)"
                  style="color: red;">Required</span>
                <span
                  *ngIf="addaddendumForm?.get('empCustodianId')?.hasError('pattern') && (addaddendumForm?.get('empCustodianId')?.dirty || addaddendumForm?.get('empCustodianId')?.touched)"
                  style="color: red;">Invalid Employee</span>
                <div class="mb-3">
                  <div class="input-group">
                    <input class="form-control edit-input dropdown-input"
                      placeholder="Employee Custodian" data-bs-toggle="collapse" data-bs-target="#empCustodian-dropdown"
                      aria-expanded="false" formControlName="empCustodianName" readonly/>
                    <span class="input-group-text dropdown-icon" data-bs-toggle="collapse"
                      data-bs-target="#empCustodian-dropdown"><i class="fa-solid fa-angle-down"></i></span>
                  </div>
                  <div #addAddendumEmpCustodianCollapse id="empCustodian-dropdown" class="collapse">
                    <div class="card card-body">
                      <input type="text" class="form-control" placeholder="Search.."
                        (input)="textChangeEmployeeCustodian(+(depID.value),$event)" formControlName="empCustodianNameSearch">
                      <button type="button" *ngFor="let emp of employeeCustodians" class="dropdown-btn btn"
                        (click)="fillEmployeeCustodian(emp.valueId,emp.employeeName)">({{emp.employeeCode}})
                        {{emp.employeeName}}</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn add-btn btn-outline-primary" id="btnadd" type="submit"
            style="max-width: 300px;">Add</button>
          <button type="reset" data-bs-dismiss="modal" class="btn btn-outline-danger" id="btncancel"
            style="max-width: 300px;">Cancel</button>
        </div>
      </form>
  </div>
</div>
