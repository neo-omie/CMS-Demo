<app-loader *ngIf="loading"></app-loader>
<h2 class="pt-3 fs-1">Dashboard</h2>
<div class="d-inline-block p-2 p-md-5" [style.width]="viewportWidth < 914 ? '100%' : '50%'">
    <div class="card">
        <div class="card-body">
            <highcharts-chart
              [Highcharts]="Highcharts"
              [options]="contractchartOptions"
              [update]="updateFlag1"
              style="width: 100%; height: 100%; display: block;">
            </highcharts-chart>
        </div>
    </div>
</div> 
<div class="d-inline-block p-2 p-md-5" [style.width]="viewportWidth < 914 ? '100%' : '50%'">
    <div class="card">
        <div class="card-body">
            <highcharts-chart
              [Highcharts]="Highcharts"
              [options]="classifiedcontractchartOptions"
              [update]="updateFlag2"
              style="width: 100%; height: 100%; display: block;">
            </highcharts-chart>
        </div>
    </div>
</div>
