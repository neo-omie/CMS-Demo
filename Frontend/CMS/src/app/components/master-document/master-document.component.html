<app-loader *ngIf="loading"></app-loader>
<h2 class="pt-3">Document Master</h2>
<div class="modal fade" id="document-add" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <form #documentForm="ngForm" (ngSubmit)="addDocument(documentForm)">
        <div class="modal-header d-flex justify-content-between">
          <h1 class="modal-title fs-5 add-header"><i class="fa-solid fa-file-circle-plus"></i> Add Document</h1>
          <button type="reset" class="btn close-btn" (click)="closeEditApproverCollapses()" data-bs-dismiss="modal"
            aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="documentName">Document Name</label>
            <input #addFile type="file" class="form-control" id="file" name="file" (change)="uploadFile($event)"
              required />
          </div>
          <br>
          <div class="form-group">
            <label for="status">Document Status</label>
            <select name="status" id="status" class="form-select" [(ngModel)]="document.status">

              <option value="1">Active</option>
              <option value="0">InActive</option>
            </select>
          </div>
          <br>
          <div class="add-modal-btn">

            <button type="submit" class="add-btn btn btn-primary add-modal-btn">Save</button>
            &nbsp;
            <button type="reset" class="btn btn-outline-danger" data-bs-dismiss="modal"
              (click)="closeEditApproverCollapses()">Cancel</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="px-md-5 px-3">
  <button class="add-btn btn btn-outline-primary mb-2">
    <a data-bs-toggle="modal" data-bs-target="#document-add"><i class="fa-solid fa-file-circle-plus"></i> Add
      document</a>
  </button>
</div>

<app-table [data]="masterDocuments.documents" [displayedColumns]="displayedColumns" [columnsInfo]="columnsInfo">
</app-table>

<p class="no-records fs-5" *ngIf="masterDocuments.documents.length == 0" style="text-align: center;">No records</p>

<app-pagination [maxPage]="maxPage" [records]="masterDocuments.documents.length" [pageNumbers]="pageNumbers"
  [GetPage]="GetPage.bind(this)"></app-pagination>

<ng-template #statusRef let-row>{{ row.status == true ? 'Active' : 'Inactive' }}</ng-template>

<ng-template #actionRef let-row>
  <i class="fa-regular fa-pen-to-square icon" data-bs-toggle="modal" data-bs-target="#document-edit" title="Edit"
    (click)="GetDocument(row.valueId)"></i>
  <a href="http://127.0.0.1:8080/{{row.displayDocumentName}}" target="_blank" style="color: #494949;" download><i
      class="fa-regular fa-eye icon"></i></a>
  <i class="fa-regular fa-trash-can icon" title="Delete" (click)="deleteDocument(row.valueId)"></i>
</ng-template>


<div class="modal fade" id="document-edit" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content">
      <div class="modal-header d-flex justify-content-between">
        <h1 style="color: whitesmoke;" class="modal-title fs-5 fw-bolder">Edit</h1>
        <button type="reset" class="btn close-btn" data-bs-dismiss="modal" aria-label="Close"
          (click)="closeEditApproverCollapses()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-file-invoice"></i></span>
            <input #editFile type="file" class="form-control" id="file-edit" name="file-edit"
              (change)="uploadFile($event)" required />
          </div>
        </div>
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-file-invoice"></i></span>
            <input type="text" value="{{getMasterDocumentById?.displayDocumentName}}" class="form-control"
              id="file-name" name="file-name" disabled required />
          </div>
        </div>
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-toggle-on"></i></span>
            <select #editDocumentStatus class="form-control form-select">
              <option value="0" selected="{{doc != undefined && doc.status == 0 ? true : false}}">InActive</option>
              <option value="1" selected="{{doc != undefined && doc.status == 1 ? true : false}}">Active</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn add-btn add-modal-btn" data-bs-dismiss="modal"
          (click)="editDocument(doc != undefined ? doc.valueId : 0)">Save</button>
        <button type="reset" class="btn btn-outline-danger" data-bs-dismiss="modal"
          (click)="closeEditApproverCollapses()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="modal fade" id="document-detail" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header d-flex justify-content-between">
        <h1 style="color: whitesmoke;" class="modal-title fs-5 fw-bolder">Detail</h1>
        <button type="button" class="btn close-btn" data-bs-dismiss="modal" aria-label="Close"><i
            class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <p class="m-1">Document ID</p>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-hashtag"></i></span>
            <input type="text" name="documentId" class="form-control" id="documentId"
              [value]=" getMasterDocumentById?.valueId" disabled>
          </div>
        </div>
        <div class="mb-3">
          <p class="m-1">Document Name</p>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-file-invoice"></i></span>
            <input type="text" name="documentName" class="form-control" id="documentName"
              [value]="getMasterDocumentById?.displayDocumentName" disabled>
          </div>
        </div>
        <div class="mb-3">
          <p class="m-1">Document Status</p>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-toggle-on"></i></span>
            <input type="text" name="documentStatus" class="form-control" id="documentStatus"
              [value]="getMasterDocumentById?.status == 1 ? 'Active' : 'InActive'" disabled>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
