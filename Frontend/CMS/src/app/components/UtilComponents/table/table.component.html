<table mat-table [dataSource]="dataSource" matSort
    class="table table-striped table-bordered align-middle mat-elevation-z8" id="table">
    <ng-container *ngFor="let column of displayedColumns; let first = first; let last = last" [matColumnDef]="column">
        <ng-container *ngIf="columnsInfo[column].isSort; else plainHeader">
            <th class="mat-header-cell" mat-header-cell *matHeaderCellDef mat-sort-header
                [ngStyle]="first?{'border-left-color':'#5f5fee'}:last?{'border-right-color': '#5f5fee'}:null">
                {{ columnsInfo[column] && columnsInfo[column].title ? columnsInfo[column].title : column}}
            </th>
        </ng-container>

        <ng-template #plainHeader>
            <th class="mat-header-cell" mat-header-cell *matHeaderCellDef
                [ngStyle]="first?{'border-left-color':'#5f5fee'}:last?{'border-right-color': '#5f5fee'}:null">
                {{ columnsInfo[column] && columnsInfo[column].title ? columnsInfo[column].title : column}}
            </th>
        </ng-template>
        <td mat-cell *matCellDef="let row">
            <ng-container *ngIf="columnsInfo[column] && columnsInfo[column].templateRef; else defaultCell"
                [ngTemplateOutlet]="columnsInfo[column].templateRef" [ngTemplateOutletContext]="{ $implicit: row }">
            </ng-container>
            <ng-template #defaultCell>
                {{ row[column] }}
            </ng-template>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="thead"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" style="border-color: #dee2e6;"></tr>
</table>
